<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#FBE9AE" id="themeColor">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Учебный дневник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: одна колонка ~720px, липкая шапка с вкладками; карточки пар — левый столбец времени как на табло звонков */
:root{
  --bg:#EEEEEE; --surface:#FFFFFF; --surface-2:#F5F5F5; --ink:#111111; --muted:#6B6B6B; --line:#D2D2D2;
  --accent:#111111; --accent-ink:#FFFFFF; --accent-soft:#E2E2E2;
  --num:#FFFFFF; --den:#111111; --den-soft:#FFFFFF; --num-soft:#111111;
  --bad:#111111; --bad-soft:#111111; --warn:#555555; --warn-soft:#D9D9D9; --ok:#111111; --ok-soft:#ECECEC;
  --lec:#111111; --prac:#555555; --lab:#888888;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --surface:#161616; --surface-2:#1F1F1F; --ink:#EDEDED; --muted:#9A9A9A; --line:#2E2E2E;
  --accent:#EDEDED; --accent-ink:#0B0B0B; --accent-soft:#2A2A2A;
  --num:#0B0B0B; --den:#EDEDED; --den-soft:#161616; --num-soft:#EDEDED;
  --bad:#EDEDED; --bad-soft:#EDEDED; --warn:#BBBBBB; --warn-soft:#3A3A3A; --ok:#EDEDED; --ok-soft:#262626;
  --lec:#EDEDED; --prac:#BBBBBB; --lab:#8A8A8A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#161616; --surface-2:#1F1F1F; --ink:#EDEDED; --muted:#9A9A9A; --line:#2E2E2E;
  --accent:#EDEDED; --accent-ink:#0B0B0B; --accent-soft:#2A2A2A;
  --num:#0B0B0B; --den:#EDEDED; --den-soft:#161616; --num-soft:#EDEDED;
  --bad:#EDEDED; --bad-soft:#EDEDED; --warn:#BBBBBB; --warn-soft:#3A3A3A; --ok:#EDEDED; --ok-soft:#262626;
  --lec:#EDEDED; --prac:#BBBBBB; --lab:#8A8A8A; color-scheme:dark;
}
@property --bg{syntax:"<color>";inherits:true;initial-value:transparent}
@property --surface{syntax:"<color>";inherits:true;initial-value:transparent}
@property --surface-2{syntax:"<color>";inherits:true;initial-value:transparent}
@property --ink{syntax:"<color>";inherits:true;initial-value:transparent}
@property --muted{syntax:"<color>";inherits:true;initial-value:transparent}
@property --line{syntax:"<color>";inherits:true;initial-value:transparent}
@property --accent{syntax:"<color>";inherits:true;initial-value:transparent}
@property --accent-ink{syntax:"<color>";inherits:true;initial-value:transparent}
@property --accent-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --num{syntax:"<color>";inherits:true;initial-value:transparent}
@property --den{syntax:"<color>";inherits:true;initial-value:transparent}
@property --den-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --num-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --bad{syntax:"<color>";inherits:true;initial-value:transparent}
@property --bad-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --warn{syntax:"<color>";inherits:true;initial-value:transparent}
@property --warn-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --ok{syntax:"<color>";inherits:true;initial-value:transparent}
@property --ok-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --lec{syntax:"<color>";inherits:true;initial-value:transparent}
@property --prac{syntax:"<color>";inherits:true;initial-value:transparent}
@property --lab{syntax:"<color>";inherits:true;initial-value:transparent}
@property --glow{syntax:"<color>";inherits:true;initial-value:transparent}
@property --glow2{syntax:"<color>";inherits:true;initial-value:transparent}
/* Стороны: группа 1 — силы света (ярко и весело), группа 10 — силы тьмы (темно и красно). Перекрывают системную тему */
:root{--glow:transparent;--glow2:transparent;transition-property:--bg,--surface,--surface-2,--ink,--muted,--line,--accent,--accent-ink,--accent-soft,--num,--den,--den-soft,--num-soft,--bad,--bad-soft,--warn,--warn-soft,--ok,--ok-soft,--lec,--prac,--lab,--glow,--glow2;transition-duration:.9s;transition-timing-function:cubic-bezier(.4,0,.2,1);}
:root.no-tr{transition:none!important}
html:root[data-side="light"]{
  --bg:#FBE9AE; --surface:#FFFFFF; --surface-2:#FFF4D2; --ink:#1C2914; --muted:#4F5636; --line:#DDBE5E;
  --accent:#F2AE00; --accent-ink:#2A2306; --accent-soft:#FFE48F;
  --num:#FFFFFF; --num-soft:#4C9A38; --den:#22311A; --den-soft:#FFFFFF;
  --bad:#D9480F; --bad-soft:#22311A; --warn:#B7791F; --warn-soft:#FFE3A0; --ok:#2E7D32; --ok-soft:#DDF3CF;
  --lec:#3F8A2E; --prac:#C27A12; --lab:#2B7BA8;
  --glow:rgba(255,200,50,.55); --glow2:rgba(130,200,80,.28); color-scheme:light;
}
html:root[data-side="dark"]{
  --bg:#0C0404; --surface:#190807; --surface-2:#240C0A; --ink:#F4DAD2; --muted:#B07E74; --line:#3E1612;
  --accent:#E0301E; --accent-ink:#FFF1EC; --accent-soft:#3A0F0B;
  --num:#190807; --num-soft:#E0301E; --den:#F4DAD2; --den-soft:#190807;
  --bad:#FF4A2E; --bad-soft:#FF4A2E; --warn:#E08A3A; --warn-soft:#3A1E0B; --ok:#F4DAD2; --ok-soft:#2C0F0C;
  --lec:#FF6B4A; --prac:#E8A87C; --lab:#C9604D;
  --glow:rgba(205,30,12,.42); --glow2:rgba(110,8,4,.55); color-scheme:dark;
}
html:root[data-side="light"] :is(.lesson,.day,.stats,.hwcard,.empty,.iconbtn,.ghost){box-shadow:0 1px 0 rgba(140,100,0,.10),0 6px 16px -6px rgba(150,105,0,.28)}
html:root[data-side="light"] .tabs{background:#F6DC8A}
html:root[data-side="light"] .time{background:#FFF0BE}
html:root[data-side="light"] .brk{color:#4F5636}
html:root[data-side="light"] .brk::before,html:root[data-side="light"] .brk::after{border-top-color:#C9A23C}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 55% at 50% -12%,var(--glow),transparent 62%),radial-gradient(70% 45% at 105% 105%,var(--glow2),transparent 70%)}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%}
.app{width:100%;min-width:0}
.stats,.top,main,.lesson,details.subj{max-width:100%}
body{overflow-x:hidden}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;position:relative;z-index:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:16px 10px;display:grid;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.brand-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Переключатель групп: группа 1 — силы света, группа 10 — силы тьмы. Свои цвета, одинаковые в обеих темах */
#groupSeg{border:0;overflow:visible;border-radius:0;gap:8px;display:inline-flex}
#groupSeg button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:10px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.02em;border:1px solid;position:relative;transition:box-shadow .2s,background .2s,color .2s}
#groupSeg button+button{border-left:1px solid}
#groupSeg svg{width:15px;height:15px;flex:none}
#groupSeg .light{background:rgba(150,190,100,.13);border-color:rgba(150,190,100,.6);color:var(--ink)}
#groupSeg .light svg{color:#B08A1E}
#groupSeg .light[aria-pressed="true"]{background:linear-gradient(160deg,#FBF4D2 0%,#D9EBB3 50%,#8DBB6C 100%);border-color:#D9B64E;color:#1F3014;
  box-shadow:0 0 0 1px rgba(217,182,78,.55),0 0 16px rgba(232,200,96,.6),inset 0 1px 0 rgba(255,255,255,.7)}
#groupSeg .light[aria-pressed="true"] svg{color:#A87A08;filter:drop-shadow(0 0 3px rgba(255,214,90,.9))}
#groupSeg .dark{background:rgba(170,40,25,.12);border-color:rgba(170,40,25,.55);color:var(--ink)}
#groupSeg .dark svg{color:#B3341F}
#groupSeg .dark[aria-pressed="true"]{background:radial-gradient(120% 140% at 25% 15%,#7E1C11 0%,#3B0B07 55%,#140302 100%);border-color:#C23A20;color:#FFD8C4;
  box-shadow:0 0 0 1px rgba(90,18,9,.8),0 0 16px rgba(214,58,30,.55),inset 0 1px 0 rgba(255,120,80,.25)}
#groupSeg .dark[aria-pressed="true"] svg{color:#FF6A3D;filter:drop-shadow(0 0 3px rgba(255,90,40,.9))}
@media (prefers-reduced-motion:no-preference){
  #groupSeg .light[aria-pressed="true"]{animation:glowL 3.2s ease-in-out infinite}
  #groupSeg .dark[aria-pressed="true"]{animation:glowD 3.2s ease-in-out infinite}
}
@keyframes glowL{50%{box-shadow:0 0 0 1px rgba(217,182,78,.7),0 0 22px rgba(232,200,96,.85),inset 0 1px 0 rgba(255,255,255,.7)}}
@keyframes glowD{50%{box-shadow:0 0 0 1px rgba(90,18,9,.9),0 0 22px rgba(230,70,35,.8),inset 0 1px 0 rgba(255,120,80,.25)}}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.num{background:var(--num-soft);color:var(--num)}
.pill.den{background:var(--den-soft);color:var(--den);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1 1 auto;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.badge.bad{background:var(--ink);color:var(--bg)}
main{display:grid;gap:14px;padding-top:4px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{flex:1;min-width:0;text-align:center;font-weight:600}
.weeknav .lbl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:grid;justify-items:center;gap:1px;position:relative}
.day .dw{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.day .dc{font-size:11px;color:var(--muted)}
.day.today{border-color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dc{color:var(--accent-ink);opacity:.85}
.day .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:currentColor}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0;text-wrap:balance}
.list{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:78px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lesson.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.time{background:var(--surface-2);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.time b{font-size:16px;font-weight:600}
.time span{font-size:13px;color:var(--muted)}
.time .pair{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;text-align:center}
.lesson.now .time .pair{color:var(--accent)}
.lbody{padding:12px 14px;min-width:0;display:grid;gap:8px}
.lbody h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.type{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.t-lec{color:var(--lec)} .t-prac{color:var(--prac)} .t-lab{color:var(--lab)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:12px;padding:5px 10px;border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on-ok{background:var(--ok-soft);color:var(--ok)}
.seg button.on-u{background:var(--ink);color:var(--bg)}
.seg button.on-r{background:var(--warn-soft);color:var(--warn)}
.hwmini{display:grid;gap:6px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.hwrow{display:flex;gap:10px;align-items:flex-start}
.hwrow input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.hwrow .txt{min-width:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.group{display:grid;gap:8px}
.ghead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ghead.over{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.hwcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.hwcard .main{flex:1;min-width:0;display:grid;gap:3px}
.hwcard .subj{font-size:12px;font-weight:700;color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:2px 4px}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big .pct{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .pct.bad{color:var(--bad)} .big .pct.warn{color:var(--warn)} .big .pct.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.subjrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.subjrow:first-child{border-top:0}
.subjrow .n{font-weight:600;font-size:14px;min-width:0}
.subjrow .v{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .u{background:var(--bad)} .bar .r{background:var(--warn)}
.settings{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.note{font-size:13px;color:var(--muted)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
.modal[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.5);display:grid;place-items:end center;
  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:640px){.modal{place-items:center}.sheet{border-radius:18px;padding:22px}}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.danger{border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:10px;padding:9px 14px;font-weight:700;margin-right:auto}

.tabs .short{display:none}
.brand-l{display:flex;align-items:center;gap:10px}
.gwrap{display:flex;align-items:center;gap:6px}
.mascot{width:42px;height:42px;flex:none;display:block;transition:filter .7s,opacity .7s,transform .7s}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.mascot.off{filter:grayscale(1);opacity:.4;transform:scale(.85)}
.md .eyes{filter:drop-shadow(0 0 2px #FF5A1E)}
@media (prefers-reduced-motion:no-preference){
  .ml:not(.off) svg{animation:bob 2.6s ease-in-out infinite}
  .ml:not(.off) .rays{animation:spin 14s linear infinite;transform-origin:24px 27px}
  .md:not(.off) svg{animation:hover 3.2s ease-in-out infinite}
  .md:not(.off) .eyes{animation:flick 2.2s steps(1) infinite}
}
/* Гроза под музыку */
.mascot .tears,.mascot .frown{opacity:0;transition:opacity .5s}
.mascot .smile,.mascot .grin{transition:opacity .5s}
html.storm .mascot .tears,html.storm .mascot .frown{opacity:1}
html.storm .mascot .smile,html.storm .mascot .grin{opacity:0}
.mascot .tears path{transform-box:fill-box;transform-origin:center top}
#dim{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s;background:linear-gradient(180deg,rgba(25,40,70,.26),rgba(25,40,70,.08))}
html[data-side="dark"] #dim{background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.08))}
html.storm #dim{opacity:1}
#rain{position:fixed;inset:0;z-index:25;pointer-events:none}
#flash{position:fixed;inset:0;z-index:26;pointer-events:none;opacity:0;background:#F3F6FF}
html[data-side="dark"] #flash{background:#FFD9CF}
@media (prefers-reduced-motion:no-preference){
  html.storm .mascot .tears path{animation:tear 1.3s ease-in infinite}
  html.storm .mascot .tears path:nth-child(2){animation-delay:.55s}
  html.storm .mascot svg{animation:sob .5s ease-in-out infinite!important}
}
@keyframes tear{0%{transform:translateY(-2px) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(10px) scale(1);opacity:0}}
@keyframes sob{50%{transform:translateY(1px) scaleY(.96)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hover{50%{transform:translateY(2px) rotate(-3deg)}}
@keyframes flick{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.35}53%{opacity:1}86%{opacity:.6}88%{opacity:1}}
.mbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:16px;line-height:1;display:grid;place-items:center;position:relative}
.mbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mbtn[aria-pressed="false"]::after{content:"";position:absolute;width:22px;height:1.5px;background:currentColor;transform:rotate(-45deg)}
.brk{display:flex;align-items:center;gap:10px;padding:0 2px;color:var(--muted);font-size:13px}
.brk::before,.brk::after{content:"";flex:1 1 12px;min-width:12px;border-top:1px dashed var(--line)}
.brk .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.brk.shared{color:var(--ink);font-weight:600}
.brk.shared::before,.brk.shared::after{border-top:1.5px solid var(--ink)}
.brk .tag{background:var(--ink);color:var(--bg);border-radius:14px;padding:5px 12px;font-weight:700;font-size:12px;line-height:1.3;min-width:0;max-width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:1px 8px;text-align:center}
.brk .tag .t{font-weight:600;opacity:.85}
.day .sh{position:absolute;top:5px;left:5px;width:6px;height:6px;border:1.5px solid currentColor;transform:rotate(45deg)}
.legend{margin:-6px 0 0;font-size:12px;display:flex;gap:4px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:7px;height:7px;margin-right:6px;vertical-align:1px}
.legend .lsh{border:1.5px solid currentColor;transform:rotate(45deg)}
.legend .lhw{border-radius:50%;background:currentColor}
.att{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--ink);color:var(--ink);border-radius:5px;padding:0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);white-space:nowrap}
.chip b{font-family:var(--f-mono)}
.chip.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ink)}
.disc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.disc:first-child{border-top:0}
.disc .n{font-weight:600;min-width:0}
.disc .b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.disc .h{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.info h2{font-size:16px}
.info dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.info dt{color:var(--muted)} .info dd{margin:0;min-width:0}
/* Защита от вылезания за экран: колонки сетки не шире контейнера, длинные подписи переносятся */
main,.list,.subjs,.settings,.group,.top{grid-template-columns:minmax(0,1fr)}
main>*,.stats>*,.subjs>*{min-width:0}
.chip{white-space:normal;overflow-wrap:anywhere}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
#groupSeg button{white-space:nowrap}
.brand,.brand-r{min-width:0}
.gwrap{flex-wrap:nowrap;min-width:0}
@media (max-width:340px){.mascot{display:none}#groupSeg button{padding:5px 7px;font-size:10px}}
/* Импорт/экспорт */
.impbar{display:flex;flex-wrap:wrap;gap:8px}
.impbar .ghost{flex:1 1 auto;text-align:center;cursor:pointer;font-size:13px}
.imp-sum{display:grid;gap:4px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.imp-bad{font-size:12px;color:var(--bad);max-height:120px;overflow:auto}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.opt input{margin-top:3px;accent-color:var(--accent)}
/* Пропуски по предметам */
.subjs{display:grid;gap:8px}
details.subj{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
details.subj summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px}
details.subj summary::-webkit-details-marker{display:none}
details.subj .sp{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.sp.bad{color:var(--bad)} .sp.warn{color:var(--warn)} .sp.ok{color:var(--ink)}
details.subj .sn{display:grid;min-width:0}
details.subj .sn b{font-size:14px;overflow-wrap:anywhere}
details.subj .chev{color:var(--muted);font-size:20px;transition:transform .2s}
details.subj[open] .chev{transform:rotate(90deg)}
details.subj summary .bar{grid-column:1/-1}
ul.misses{list-style:none;margin:0;padding:2px 12px 10px;display:grid;gap:2px;border-top:1px solid var(--line)}
ul.misses li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
ul.misses li:last-child{border-bottom:0}
ul.misses .dd{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.misses .tt{color:var(--muted);font-family:var(--f-mono);font-size:12px;min-width:0}
.mk{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.mk.mu{background:var(--bad);color:var(--surface)} .mk.mr{background:var(--warn-soft);color:var(--warn)}
.cleanrow{display:grid;gap:6px;padding-top:6px}
details.alldates>summary{cursor:pointer;list-style:none}
details.alldates>summary::-webkit-details-marker{display:none}
details.alldates>summary::after{content:" ›";display:inline-block;transition:transform .2s}
details.alldates[open]>summary::after{transform:rotate(90deg)}
.lmiss{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:transparent}
.lmiss.hot{border-color:var(--bad);color:var(--bad)}

  .day .dn{font-size:16px}

function fresh(){return {v:2,cur:'g1',groups:{g1:freshGroup('Группа 1',DEF_SCHEDULE),g10:freshGroup('Группа 10',DEF_SCHEDULE_10)},flip:false,updatedAt:0}}
function migrate(s){
  if(!s)return null;
  const f=fresh();
  if(s.v===2){s.groups=Object.assign(f.groups,s.groups||{});const r=Object.assign(f,s);if(!r.groups[r.cur])r.cur='g1';return r}
  if(s.v===1){Object.assign(f.groups.g1,{schedule:s.schedule||f.groups.g1.schedule,hw:s.hw||[],abs:s.abs||{},start:s.start||'2026-09-01'});f.flip=!!s.flip;f.updatedAt=s.updatedAt||0;return f}
  return null;
}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
const todayD=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
function weekType(d){
  const w=Math.round((mondayOf(d)-ANCHOR)/(7*864e5));
  let den=((w%2)+2)%2===0; if(state.flip)den=!den; return den?'den':'num';
}
const WT_NAME={num:'числитель',den:'знаменатель'};
const LATE_START=new Date(2026,9,3); // пропедевтические курсы начались 3 октября
function lessonsForG(g,d){
  const dow=d.getDay(); if(!dow)return [];
  let ls=((g.schedule[weekType(d)]||{})[dow]||[]).slice().sort((a,b)=>a.s.localeCompare(b.s));
  if(d<LATE_START)ls=ls.filter(l=>!(CUR_BY[l.name]&&CUR_BY[l.name].late));
  return ls;
}
function lessonsFor(d){return lessonsForG(G(),d)}
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function bigGaps(ls){const r=[];for(let i=1;i<ls.length;i++){const a=toMin(ls[i-1].e),b=toMin(ls[i].s);if(b-a>=BIG)r.push({a,b,after:i-1})}return r}
function sharedWith(d,gap){
  const out=[];
  for(const [k,g] of Object.entries(state.groups)){
    if(k===state.cur)continue;
    for(const o of bigGaps(lessonsForG(g,d))){const s=Math.max(gap.a,o.a),e=Math.min(gap.b,o.b);if(e-s>=BIG){out.push({name:g.name,s,e});break}}
  }
  return out;
}
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<12||m100>14)?b:c};
function breakRow(d,g){
  const sh=sharedWith(d,g),len=g.b-g.a,label=len<=BIG+5?'Большая перемена':'Окно '+len+' мин';
  if(sh.length){const x=sh[0];return `<div class="brk shared"><span class="tag"><span>${len<=BIG+5?'Общая перемена':'Общее окно'} с ${esc(sh.map(s=>s.name.replace(/^Группа/,'группой')).join(', '))}</span><span class="t">${fromMin(x.s)}–${fromMin(x.e)}</span></span></div>`}
  return `<div class="brk"><span>${label}</span><span class="t">${fromMin(g.a)}–${fromMin(g.b)}</span></div>`;
}
function startedOrPast(d,l){const t=todayD();if(d<t)return true;if(d>t)return false;return l.s<=nowHM()}
function heldYet(d,l){const t=todayD();if(d<t)return true;if(d>t)return false;return l.e<=nowHM()}
function relLabel(s){

}

// ---------- статистика пропусков ----------
function stats(){
  const res={held:0,u:0,r:0,subj:{}};
  let d=parse(G().start||'2026-09-01');const t=todayD();
  let guard=0;
  while(d<=t&&guard++<400){
    for(const l of lessonsFor(d)){
      const key=ymd(d)+'|'+l.id,a=G().abs[key];
      if(!heldYet(d,l)&&!a)continue;
      res.held++;const s=res.subj[l.name]||(res.subj[l.name]={held:0,u:0,r:0});s.held++;
      if(!s.list)s.list=[];
      if(a==='u'){res.u++;s.u++}else if(a==='r'){res.r++;s.r++}
      if(a)s.list.push({key,d:new Date(d),l,v:a});
    }
    d=addDays(d,1);
  }
  return res;
}
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;

    <button class="primary" data-act="abs-add">+ Добавить пропуск</button>

    <div class="field"><label>Тип недели</label>
      <div class="actions"><span class="note">Сейчас неделя ${ymd(mondayOf(ui.sel))===ymd(mondayOf(todayD()))?'':'(выбранная) '}— <b>${WT_NAME[weekType(ui.sel)]}</b></span>

// ---------- файл пропусков: загрузка и сохранение ----------
const MARK_IN={'н':'u','n':'u','u':'u','б':'r','r':'r','уваж':'r','уваж.':'r','уважительная':'r','у':'r'};
function groupKeyFrom(v){
  if(!v)return state.cur;
  const s=String(v).toLowerCase().replace(/\s+/g,' ').trim();
  for(const [k,g] of Object.entries(state.groups)){if(k===s||g.name.toLowerCase()===s||g.name.toLowerCase().replace('группа ','')===s.replace('группа ',''))return k}
  return null;
}
function parseImport(text){
  let o;
  try{o=JSON.parse(String(text).trim().replace(/^﻿/,''))}catch(e){return {err:'Не получилось прочитать: это не файл пропусков или текст скопирован не целиком.'}}
  if(!o||!Array.isArray(o.items))return {err:'В файле нет списка пропусков.'};
  const gk=groupKeyFrom(o.group);
  if(!gk)return {err:`В дневнике нет группы «${o.group}».`};
  const g=state.groups[gk],ok=[],bad=[];let min=null,max=null;
  for(const it of o.items){
    const mark=MARK_IN[String(it.mark||'н').toLowerCase().trim()];
    const d=/^\d{4}-\d{2}-\d{2}$/.test(it.date||'')?parse(it.date):null;
    if(!d||!mark){bad.push(it);continue}
    const ls=lessonsForG(g,d);
    let l=ls.find(x=>x.s===it.time&&x.name===it.subject)||ls.find(x=>x.s===it.time)||(ls.filter(x=>x.name===it.subject).length===1?ls.find(x=>x.name===it.subject):null);
    if(!l){bad.push(it);continue}
    ok.push({key:it.date+'|'+l.id,mark});
    if(!min||it.date<min)min=it.date;if(!max||it.date>max)max=it.date;
  }
  return {o,gk,ok,bad,min,max};
}
const fmtD=s=>{const d=parse(s);return d.getDate()+' '+MON_S[d.getMonth()]};
function importModal(r){
  if(r.err){openModal(`<h3>Файл не подошёл</h3><p>${esc(r.err)}</p><div class="btns"><button class="primary" data-act="close">Понятно</button></div>`,false);return}
  ui.imp=r;
  const g=state.groups[r.gk],u=r.ok.filter(x=>x.mark==='u').length,rr=r.ok.length-u;
  openModal(`<h3>Загрузка пропусков</h3>
  <div class="imp-sum">
    <div><b>${esc(g.name)}</b>${r.o.student?` · ${esc(r.o.student)}`:''}</div>
    <div>${r.ok.length} ${plural(r.ok.length,'пропуск','пропуска','пропусков')}${r.min?` с ${fmtD(r.min)} по ${fmtD(r.max)}`:''}</div>
    <div class="note">без причины: ${u}, уважительных: ${rr}</div>
  </div>
  ${r.bad.length?`<div class="imp-bad">Не нашёл в расписании (${r.bad.length}): ${r.bad.map(b=>esc((b.date||'?')+' '+(b.time||'')+' '+(b.subject||''))).join('; ')}</div>`:''}
  <label class="opt"><input type="radio" name="impMode" id="impReplace" checked> <span>Заменить мои отметки за этот период<br><span class="note">то, что ты ставил сам с ${r.min?fmtD(r.min):'—'} по ${r.max?fmtD(r.max):'—'}, будет заменено файлом</span></span></label>
  <label class="opt"><input type="radio" name="impMode" id="impAdd"> <span>Добавить к моим отметкам</span></label>
  ${r.o.start?`<label class="opt"><input type="checkbox" id="impStart" checked> <span>Считать пары с ${fmtD(r.o.start)}</span></label>`:''}
  <div class="btns"><button type="button" class="ghost" data-act="close">Отмена</button><button class="primary" data-act="imp-do" ${r.ok.length?'':'disabled'}>Загрузить</button></div>`,false);
}
function doImport(){
  const r=ui.imp;if(!r)return;
  const g=state.groups[r.gk],replace=$('#impReplace')&&$('#impReplace').checked;
  if(replace&&r.min){for(const k of Object.keys(g.abs)){const ds=k.split('|')[0];if(ds>=r.min&&ds<=r.max)delete g.abs[k]}}
  for(const x of r.ok)g.abs[x.key]=x.mark;
  const st=$('#impStart');if(st&&st.checked&&r.o.start)g.start=r.o.start;
  state.cur=r.gk;ui.imp=null;ui.tab='abs';save();
  openModal(`<h3>Готово</h3><p>Загружено ${r.ok.length} ${plural(r.ok.length,'пропуск','пропуска','пропусков')}.</p><div class="btns"><button class="primary" data-act="close">Отлично</button></div>`,false);
  render();
}
function exportText(){
  const g=G(),items=[];
  for(const [k,v] of Object.entries(g.abs).sort()){
    const [ds,id]=k.split('|'),l=lessonsFor(parse(ds)).find(x=>x.id===id);
    if(l)items.push({date:ds,time:l.s,subject:l.name,mark:v==='r'?'уваж':'Н'});
  }
  return JSON.stringify({format:'dnevnik-propuski',version:1,group:g.name,start:g.start,items},null,1);
}
function doExport(){
  const txt=exportText(),name='propuski-'+G().name.replace(/\s+/g,'')+'.json';
  try{
    const blob=new Blob([txt],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){}
  openModal(`<h3>Копия пропусков</h3><p class="note" style="margin:0">Если файл не скачался, скопируй текст ниже и сохрани в заметки. Потом его можно вставить через «Вставить текст».</p>
    <div class="field"><textarea id="expText" readonly style="min-height:160px;font-family:var(--f-mono);font-size:11px">${esc(txt)}</textarea></div>
    <div class="btns"><button class="ghost" data-act="close">Закрыть</button><button class="primary" data-act="exp-copy">Скопировать</button></div>`,false);
}

// ---------- события ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');
  if(!b){if(e.target.id==='modal')closeModal();return}
  if(b.dataset.tab){ui.tab=b.dataset.tab;render();return}
  const a=b.dataset.act;
  if(a==='group'){const g=b.dataset.g;if(state.groups[g]&&g!==state.cur){const r=b.getBoundingClientRect();fx.burst((SIDES[g]||SIDES.g1).cls,r.left+r.width/2,r.top+r.height/2);state.cur=g;ui.edit=false;save();render()}}
  else if(a==='goSubj'){ui.openSubj=b.dataset.subj;ui.tab='abs';render();const el=document.querySelector(`details.subj[open]`);el&&el.scrollIntoView({block:'center',behavior:'smooth'})}
  else if(a==='pick'){ui.sel=parse(b.dataset.date);render()}
  else if(a==='wk'){ui.sel=addDays(ui.sel,7*Number(b.dataset.n));render()}
  else if(a==='today'){ui.sel=defaultSel();render()}
  else if(a==='edit'){ui.edit=!ui.edit;render()}
  else if(a==='abs'){const v=b.dataset.v;if(v)G().abs[b.dataset.key]=v;else delete G().abs[b.dataset.key];save();render();if(ui.absDate)absModal(ui.absDate)}
  else if(a==='abs-add'){absModal(ymd(todayD()))}
  else if(a==='imp-paste'){openModal(`<h3>Вставить пропуски</h3><p class="note" style="margin:0">Вставь сюда текст файла пропусков целиком.</p><div class="field"><textarea id="impText" style="min-height:160px;font-family:var(--f-mono);font-size:11px" placeholder='{"format":"dnevnik-propuski", ...}'></textarea></div><div class="btns"><button class="ghost" data-act="close">Отмена</button><button class="primary" data-act="imp-text">Дальше</button></div>`)}
  else if(a==='imp-text'){importModal(parseImport($('#impText').value))}
  else if(a==='imp-do'){doImport()}
  else if(a==='exp'){doExport()}
  else if(a==='exp-copy'){const t=$('#expText');const ok=()=>{b.textContent='Скопировано'};try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select()})}catch(e){t.select()}}
  else if(a==='abs-day'){const ds=ui.absDate,v=b.dataset.v;for(const l of lessonsFor(parse(ds))){const k=ds+'|'+l.id;if(v)G().abs[k]=v;else delete G().abs[k]}save();render();absModal(ds)}
  else if(a==='abs-del'){delete G().abs[b.dataset.key];save();render()}
  else if(a==='hwf'){ui.hwFilter=b.dataset.v;render()}
  else if(a==='hw-add'){
    const subj=b.dataset.subj||allSubjects()[0]||'';
    const from=b.dataset.date?parse(b.dataset.date):todayD();
    hwForm({subject:subj,due:ymd(b.dataset.subj?nextOccurrence(subj,from):nextOccurrence(subj,todayD())),text:''});
  }
  else if(a==='hw-edit'){const h=G().hw.find(x=>x.id===b.dataset.id);h&&hwForm(h)}
  else if(a==='hw-del'){
    if(b.dataset.confirm){G().hw=G().hw.filter(x=>x.id!==b.dataset.id);save();closeModal();render()}
    else{b.dataset.confirm='1';b.textContent='Точно удалить?'}
  }
  else if(a==='close')closeModal();
  else if(a==='les-add'){const d=ui.sel;lessonForm({type:'Практика'},weekType(d),d.getDay())}
  else if(a==='les-edit'){const d=ui.sel,wt=weekType(d),l=(G().schedule[wt][d.getDay()]||[]).find(x=>x.id===b.dataset.id);l&&lessonForm(l,wt,d.getDay())}
  else if(a==='les-del'){

    else{b.dataset.confirm='1';b.textContent='Точно удалить?'}
  }
  else if(a==='flip'){state.flip=!state.flip;save();render()}
});
document.addEventListener('change',e=>{

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='hwForm'){
    const id=$('#hwId').value,text=$('#hwText').value.trim();if(!text)return;
    const rec={subject:$('#hwSubj').value,due:$('#hwDue').value,text};
    if(id){Object.assign(G().hw.find(x=>x.id===id),rec)}else G().hw.push({id:uid(),done:false,...rec});
    save();closeModal();render();
  }else if(e.target.id==='lesForm'){
    const{l,wt,dow}=editing;
    const rec={s:$('#lS').value,e:$('#lE').value,name:$('#lN').value.trim(),type:$('#lT').value,teacher:$('#lP').value.trim(),room:$('#lR').value.trim()};
    if(!rec.name)return;
    const arr=G().schedule[wt][dow]||(G().schedule[wt][dow]=[]);
    if(l.id)Object.assign(arr.find(x=>x.id===l.id),rec);else arr.push({id:wt[0]+dow+uid(),...rec});
    save();closeModal();render();
  }
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.matches&&t.matches('details.subj')){if(t.open)ui.openSubj=t.dataset.subj;else if(ui.openSubj===t.dataset.subj)ui.openSubj=null}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

// ---------- сохранение ----------
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
let remoteRef=null,writing=false,dirty=false,wTimer=null;
function setSync(t){$('#sync').textContent=t}
function save(){state.updatedAt=Date.now();persistLocal();if(remoteRef){clearTimeout(wTimer);wTimer=setTimeout(flush,700)}}
async function flush(){
  if(!remoteRef)return;
  if(writing){dirty=true;return}
  writing=true;
  try{await remoteRef.set(JSON.parse(JSON.stringify(state)));setSync('Сохранено в облаке, доступно с любого устройства')}
  catch(e){setSync('Не удалось сохранить в облако, данные остались на этом устройстве')}
  writing=false;if(dirty){dirty=false;flush()}
}
function adopt(r){const m=migrate(JSON.parse(JSON.stringify(r)));if(!m)return;state=m;persistLocal();render()}
(async()=>{
  if(!window.claude||!window.claude.use)return;
  setSync('Подключаюсь к облаку…');
  const slow=setTimeout(()=>setSync('Облако пока недоступно, данные сохраняются на этом устройстве'),10000);
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){clearTimeout(slow);setSync('Данные сохраняются на этом устройстве');return}
    const id=await user.id();
    if(!id){clearTimeout(slow);setSync('Данные сохраняются на этом устройстве');return}
    remoteRef=db.doc('data/users/'+id+'/diary');
    const snap=await remoteRef.get();clearTimeout(slow);
    if(snap.exists){const r=snap.data();
      if(r&&(r.v===1||r.v===2)&&(r.updatedAt||0)>(state.updatedAt||0))adopt(r);
      else if((state.updatedAt||0)>((r&&r.updatedAt)||0))flush();
    }else if(state.updatedAt)flush();
    setSync('Синхронизировано с облаком');
    remoteRef.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites)return;
      const r=s.data();if(r&&(r.v===1||r.v===2)&&(r.updatedAt||0)>(state.updatedAt||0))adopt(r);
    },()=>setSync('Связь с облаком потеряна, изменения сохраняются на этом устройстве'));
  }catch(e){clearTimeout(slow);setSync('Данные сохраняются на этом устройстве')}
})();

// ---------- гроза под музыку ----------
const storm=(()=>{
  let cv=null,ctx=null,flash=null,drops=[],raf=0,on=false,level=0,last=0,nextBolt=0,bolt=null;
  const rm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function resize(){if(!cv)return;const d=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
  function setup(){
    if(cv)return;
    cv=document.createElement('canvas');cv.id='rain';cv.setAttribute('aria-hidden','true');document.body.appendChild(cv);ctx=cv.getContext('2d');
    flash=document.createElement('div');flash.id='flash';flash.setAttribute('aria-hidden','true');document.body.appendChild(flash);
    resize();addEventListener('resize',resize);
  }
  const drop=(W,H,init)=>({x:rnd(-W*.25,W),y:init?rnd(-H,H):rnd(-80,-10),v:rnd(750,1150),l:rnd(12,24)});
  function start(){
    document.documentElement.classList.add('storm');
    if(rm())return;
    setup();on=true;nextBolt=performance.now()+rnd(1200,2800);
    if(!raf){last=performance.now();raf=requestAnimationFrame(step)}
  }
  function stop(){document.documentElement.classList.remove('storm');on=false}
  function strike(W,H){
    const pts=[];let x=rnd(.15,.85)*W,y=-5;const end=H*rnd(.4,.7);
    pts.push([x,y]);while(y<end){y+=rnd(14,34);x+=rnd(-24,24);pts.push([x,y])}
    const br=[];for(let k=0;k<2;k++){const i=Math.floor(rnd(2,pts.length-2));let[bx,by]=pts[i];const dir=Math.random()<.5?-1:1;const b=[[bx,by]];for(let j=0;j<4;j++){bx+=dir*rnd(8,22);by+=rnd(10,24);b.push([bx,by])}br.push(b)}
    bolt={pts,br,t:0};
    if(flash.animate)flash.animate([{opacity:0},{opacity:.55,offset:.07},{opacity:.08,offset:.22},{opacity:.35,offset:.32},{opacity:0}],{duration:750,easing:'ease-out'});
    const app=document.querySelector('.app');
    if(app&&app.animate)app.animate([{transform:'translate(0,0)'},{transform:'translate(-2px,1px)'},{transform:'translate(2px,-1px)'},{transform:'translate(-1px,0)'},{transform:'translate(0,0)'}],{duration:320,delay:120});
  }
  function line(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke()}
  function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    level=Math.max(0,Math.min(1,level+(on?1:-1)*dt/1.6));
    const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);
    const dark=document.documentElement.dataset.side==='dark';
    const target=Math.round(level*Math.min(230,W*H/2000));
    while(drops.length<target)drops.push(drop(W,H,drops.length<target*.8&&level<.2));
    if(drops.length>target)drops.length=target;
    ctx.strokeStyle=dark?'rgba(215,205,235,.36)':'rgba(35,65,120,.40)';ctx.lineWidth=1.2;ctx.lineCap='round';
    ctx.beginPath();
    for(const d of drops){
      d.y+=d.v*dt;d.x+=d.v*dt*.2;
      if(d.y>H+30||d.x>W+30)Object.assign(d,drop(W,H,false));
      ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.l*.2,d.y-d.l);
    }
    ctx.stroke();
    if(on&&now>nextBolt){strike(W,H);nextBolt=now+rnd(4500,9500)}
    if(bolt){
      bolt.t+=dt;const a=Math.max(0,1-bolt.t/.4)*(bolt.t>.07&&bolt.t<.13?.25:1);
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
      ctx.shadowColor=dark?'rgba(255,90,60,.95)':'rgba(150,190,255,.95)';ctx.shadowBlur=18;
      ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=2.6;line(bolt.pts);
      ctx.lineWidth=1.2;bolt.br.forEach(line);ctx.restore();
      if(bolt.t>.4)bolt=null;
    }
    if(level>0||bolt)raf=requestAnimationFrame(step);else{raf=0;ctx.clearRect(0,0,W,H)}
  }
  return {start,stop};
})();

// ---------- музыка ----------
const MUSIC_SRC='music.mp3';
(function(){
  const btn=$('#musicBtn');
  let on=true;try{on=localStorage.getItem('diary.music')!=='off'}catch(e){}
  const a=new Audio();a.loop=true;a.volume=.6;a.preload='auto';
  const upd=()=>{const p=!a.paused;btn.setAttribute('aria-pressed',p);btn.title=p?'Выключить музыку':'Включить музыку'};
  a.addEventListener('play',()=>{upd();storm.start()});a.addEventListener('pause',()=>{upd();storm.stop()});
  a.addEventListener('error',()=>{btn.hidden=true;off()});
  a.src=MUSIC_SRC;
  const tryPlay=()=>{const pr=a.play();return pr&&pr.then?pr:Promise.resolve()};
  const evs=['touchend','click','keydown'];
  function first(e){
    if(e.target.closest&&e.target.closest('#musicBtn'))return;
    if(!on||!a.paused){off();return}
    tryPlay().then(off,()=>{});
  }
  function off(){evs.forEach(t=>document.removeEventListener(t,first,true))}
  evs.forEach(t=>document.addEventListener(t,first,true));
  btn.addEventListener('click',()=>{
    if(a.paused){on=true;tryPlay().catch(()=>{})}else{on=false;a.pause()}
    try{localStorage.setItem('diary.music',on?'on':'off')}catch(e){}
    off();upd();
  });
  if(on)tryPlay().then(off,()=>{});
  upd();
})();

// ---------- переход между сторонами: волна + частицы ----------
const fx=(()=>{
  let cv=null,ctx=null,parts=[],ring=null,raf=0,last=0;
  const rm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){if(!cv)return;const d=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
  function ensure(){if(cv)return;cv=document.createElement('canvas');cv.id='fx';cv.setAttribute('aria-hidden','true');document.body.appendChild(cv);ctx=cv.getContext('2d');resize();addEventListener('resize',resize)}
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function burst(side,x,y){
    if(rm())return;
    ensure();
    const L=side==='light',W=innerWidth,H=innerHeight;
    ring={x,y,t:0,L,max:Math.hypot(Math.max(x,W-x),Math.max(y,H-y))*1.05};
    const N=Math.round(Math.min(170,60+W*H/6000));
    for(let i=0;i<N;i++){ // взрыв из кнопки
      const a=rnd(0,Math.PI*2),sp=rnd(1.5,L?7:6);
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(L?1.5:0.5),t:0,max:rnd(.9,1.8),r:rnd(1,L?2.8:3.2),L,hue:L?rnd(38,58):rnd(2,28),tw:rnd(0,6.3),star:L&&Math.random()<.25});
    }
    for(let i=0;i<N*.7;i++){ // волна частиц по экрану
      const d=Math.random();
      parts.push({x:rnd(0,W),y:L?H+rnd(0,60):rnd(-60,H*.2),vx:rnd(-.6,.6),vy:L?rnd(-4.5,-1.5):rnd(.8,2.6),t:-d*.5,max:rnd(1.2,2.2),r:rnd(.8,2.2),L,hue:L?rnd(40,60):rnd(0,22),tw:rnd(0,6.3),star:L&&Math.random()<.15,ash:!L&&Math.random()<.35});
    }
    if(!raf){last=performance.now();raf=requestAnimationFrame(step)}
  }
  function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;const f=dt*60;
    const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);
    if(ring){
      ring.t+=dt;const p=Math.min(1,ring.t/1.1),e=1-Math.pow(1-p,3),r=Math.max(1,ring.max*e),al=1-p;
      const g=ctx.createRadialGradient(ring.x,ring.y,r*.55,ring.x,ring.y,r);
      const c=ring.L?'255,206,70':'215,35,15';
      g.addColorStop(0,`rgba(${c},0)`);g.addColorStop(.82,`rgba(${c},${.32*al})`);g.addColorStop(.95,`rgba(${ring.L?'255,250,220':'255,120,60'},${.5*al})`);g.addColorStop(1,`rgba(${c},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(ring.x,ring.y,r,0,Math.PI*2);ctx.fill();
      if(p>=1)ring=null;
    }
    parts=parts.filter(q=>q.t<q.max);
    for(const q of parts){
      q.t+=dt;if(q.t<0)continue;
      q.vx*=Math.pow(.965,f);q.vy=q.vy*Math.pow(.965,f)+(q.L?-.035:(q.ash?.03:-.02))*f;
      q.x+=q.vx*f;q.y+=q.vy*f;
      if(!q.L)q.x+=Math.sin(q.t*6+q.tw)*.4*f;
      let a=Math.max(0,1-q.t/q.max);a*=Math.min(1,q.t*8);
      if(q.L)a*=.65+.35*Math.sin(q.tw+q.t*14);else a*=.7+.3*Math.sin(q.tw+q.t*22);
      const r=q.r*(q.L?1:(.6+.4*a));
      if(q.ash){ctx.fillStyle=`rgba(40,10,8,${a*.8})`;ctx.beginPath();ctx.arc(q.x,q.y,r*1.3,0,Math.PI*2);ctx.fill();continue}
      ctx.fillStyle=`hsla(${q.hue},100%,${q.L?60:45}%,${a*.22})`;ctx.beginPath();ctx.arc(q.x,q.y,r*3.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`hsla(${q.hue},100%,${q.L?82:62}%,${a})`;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();
      if(q.star){ctx.strokeStyle=`hsla(${q.hue},100%,88%,${a*.9})`;ctx.lineWidth=1;const s=r*4;ctx.beginPath();ctx.moveTo(q.x-s,q.y);ctx.lineTo(q.x+s,q.y);ctx.moveTo(q.x,q.y-s);ctx.lineTo(q.x,q.y+s);ctx.stroke()}
    }
    if(parts.length||ring)raf=requestAnimationFrame(step);else{raf=0;ctx.clearRect(0,0,W,H)}
  }
  return {burst};
})();

document.documentElement.classList.add('no-tr');
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('no-tr')));
setInterval(()=>{if(ui.tab==='sched'&&$('#modal').hidden)render()},60000);
</script>
